<text xml:space="preserve" text-anchor="start" x="654.84" y="-1321.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT THIS BLOCK MEANS</text>
<text xml:space="preserve" text-anchor="start" x="654.84" y="-1307.6" font-family="Arial" font-size="14.00">Enter the demonstration in the actual</text>
<text xml:space="preserve" text-anchor="start" x="654.84" y="-1293.6" font-family="Arial" font-size="14.00">demonstration, using the original program.</text>
<text xml:space="preserve" text-anchor="start" x="654.84" y="-1265.6" font-family="Arial" font-weight="bold" font-size="14.00">WHERE IT FITS</text>
<text xml:space="preserve" text-anchor="start" x="654.84" y="-1251.6" font-family="Arial" font-size="14.00">main runs after the type and function</text>
<text xml:space="preserve" text-anchor="start" x="654.84" y="-1237.6" font-family="Arial" font-size="14.00">definitions; these are consecutive source</text>
<text xml:space="preserve" text-anchor="start" x="654.84" y="-1223.6" font-family="Arial" font-size="14.00">excerpts.</text>
<text xml:space="preserve" text-anchor="start" x="654.84" y="-1195.6" font-family="Arial" font-weight="bold" font-size="14.00">WHY IT IS HERE</text>
<text xml:space="preserve" text-anchor="start" x="654.84" y="-1181.6" font-family="Arial" font-size="14.00">CodecFactory groups two independent creation</text>
<text xml:space="preserve" text-anchor="start" x="654.84" y="-1167.6" font-family="Arial" font-size="14.00">operations under one family choice.</text>
<text xml:space="preserve" text-anchor="start" x="654.84" y="-1153.6" font-family="Arial" font-size="14.00">round_trip depends only on factory and</text>
<text xml:space="preserve" text-anchor="start" x="654.84" y="-1139.6" font-family="Arial" font-size="14.00">product interfaces, and explicitly checks</text>
<text xml:space="preserve" text-anchor="start" x="654.84" y="-1125.6" font-family="Arial" font-size="14.00">the compatibility invariant.</text>
<text xml:space="preserve" text-anchor="start" x="654.84" y="-1097.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT MUST STAY TRUE</text>
<text xml:space="preserve" text-anchor="start" x="654.84" y="-1083.6" font-family="Arial" font-size="14.00">For each supported digit, read(write(value))</text>
<text xml:space="preserve" text-anchor="start" x="654.84" y="-1069.6" font-family="Arial" font-size="14.00">equals value within one family.</text>
<text xml:space="preserve" text-anchor="start" x="654.84" y="-1041.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT CAN GO WRONG</text>
<text xml:space="preserve" text-anchor="start" x="654.84" y="-1027.6" font-family="Arial" font-size="14.00">Pair the framed writer with the plain</text>
<text xml:space="preserve" text-anchor="start" x="654.84" y="-1013.6" font-family="Arial" font-size="14.00">reader. Writing 7 produces [7], which the</text>
<text xml:space="preserve" text-anchor="start" x="654.84" y="-999.6" font-family="Arial" font-size="14.00">plain reader rejects. Matching interface</text>
<text xml:space="preserve" text-anchor="start" x="654.84" y="-985.6" font-family="Arial" font-size="14.00">types do not imply matching wire formats.</text>
<text xml:space="preserve" text-anchor="start" x="654.84" y="-957.6" font-family="Arial" font-weight="bold" font-size="14.00">FIND THE CODE</text>
