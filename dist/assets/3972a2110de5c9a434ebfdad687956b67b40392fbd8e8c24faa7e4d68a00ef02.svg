<text xml:space="preserve" text-anchor="start" x="587.74" y="-638" font-family="Arial" font-weight="bold" font-size="14.00">WHAT MUST STAY TRUE</text>
<text xml:space="preserve" text-anchor="start" x="587.74" y="-624" font-family="Arial" font-size="14.00">Every successful child result is in the</text>
<text xml:space="preserve" text-anchor="start" x="587.74" y="-610" font-family="Arial" font-size="14.00">allowed nonnegative range.</text>
<text xml:space="preserve" text-anchor="start" x="587.74" y="-582" font-family="Arial" font-weight="bold" font-size="14.00">WHAT CAN GO WRONG</text>
<text xml:space="preserve" text-anchor="start" x="587.74" y="-568" font-family="Arial" font-size="14.00">Copy a raw child pointer into two owning</text>
<text xml:space="preserve" text-anchor="start" x="587.74" y="-554" font-family="Arial" font-size="14.00">unique_ptr objects. Destruction attempts to</text>
<text xml:space="preserve" text-anchor="start" x="587.74" y="-540" font-family="Arial" font-size="14.00">delete the same object twice, causing</text>
<text xml:space="preserve" text-anchor="start" x="587.74" y="-526" font-family="Arial" font-size="14.00">undefined behavior. unique_ptr promises</text>
<text xml:space="preserve" text-anchor="start" x="587.74" y="-512" font-family="Arial" font-size="14.00">exclusive ownership; inventing duplicate</text>
<text xml:space="preserve" text-anchor="start" x="587.74" y="-498" font-family="Arial" font-size="14.00">owners violates it.</text>
