<text xml:space="preserve" text-anchor="start" x="661.74" y="-374.4" font-family="Arial" font-weight="bold" font-size="14.00">WHAT THIS BLOCK MEANS</text>
<text xml:space="preserve" text-anchor="start" x="661.74" y="-360.4" font-family="Arial" font-size="14.00">Observe checks and effects in the actual</text>
<text xml:space="preserve" text-anchor="start" x="661.74" y="-346.4" font-family="Arial" font-size="14.00">demonstration, using the original program.</text>
<text xml:space="preserve" text-anchor="start" x="661.74" y="-318.4" font-family="Arial" font-weight="bold" font-size="14.00">WHERE IT FITS</text>
<text xml:space="preserve" text-anchor="start" x="661.74" y="-304.4" font-family="Arial" font-size="14.00">main runs after the type and function</text>
<text xml:space="preserve" text-anchor="start" x="661.74" y="-290.4" font-family="Arial" font-size="14.00">definitions; these are consecutive source</text>
<text xml:space="preserve" text-anchor="start" x="661.74" y="-276.4" font-family="Arial" font-size="14.00">excerpts.</text>
<text xml:space="preserve" text-anchor="start" x="661.74" y="-248.4" font-family="Arial" font-weight="bold" font-size="14.00">WHY IT IS HERE</text>
<text xml:space="preserve" text-anchor="start" x="661.74" y="-234.4" font-family="Arial" font-size="14.00">A fixed tree with one shared query lets the</text>
<text xml:space="preserve" text-anchor="start" x="661.74" y="-220.4" font-family="Arial" font-size="14.00">same algorithm measure leaves and groups.</text>
<text xml:space="preserve" text-anchor="start" x="661.74" y="-206.4" font-family="Arial" font-size="14.00">Bottom&#45;up construction and unique_ptr make</text>
<text xml:space="preserve" text-anchor="start" x="661.74" y="-192.4" font-family="Arial" font-size="14.00">lifetime clear.</text>
<text xml:space="preserve" text-anchor="start" x="661.74" y="-164.4" font-family="Arial" font-weight="bold" font-size="14.00">WHAT MUST STAY TRUE</text>
<text xml:space="preserve" text-anchor="start" x="661.74" y="-150.4" font-family="Arial" font-size="14.00">A group visits each child once and does not</text>
<text xml:space="preserve" text-anchor="start" x="661.74" y="-136.4" font-family="Arial" font-size="14.00">retain a running total between calls.</text>
<text xml:space="preserve" text-anchor="start" x="661.74" y="-108.4" font-family="Arial" font-weight="bold" font-size="14.00">WHAT CAN GO WRONG</text>
<text xml:space="preserve" text-anchor="start" x="661.74" y="-94.4" font-family="Arial" font-size="14.00">Return 1 for an empty group. An empty</text>
<text xml:space="preserve" text-anchor="start" x="661.74" y="-80.4" font-family="Arial" font-size="14.00">project reports one minute. The identity</text>
