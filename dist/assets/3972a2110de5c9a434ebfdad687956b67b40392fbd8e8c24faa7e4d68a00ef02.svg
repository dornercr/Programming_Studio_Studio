<text xml:space="preserve" text-anchor="start" x="669.74" y="-1321.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT THIS BLOCK MEANS</text>
<text xml:space="preserve" text-anchor="start" x="669.74" y="-1307.6" font-family="Arial" font-size="14.00">Enter the demonstration in the actual</text>
<text xml:space="preserve" text-anchor="start" x="669.74" y="-1293.6" font-family="Arial" font-size="14.00">demonstration, using the original program.</text>
<text xml:space="preserve" text-anchor="start" x="669.74" y="-1265.6" font-family="Arial" font-weight="bold" font-size="14.00">WHERE IT FITS</text>
<text xml:space="preserve" text-anchor="start" x="669.74" y="-1251.6" font-family="Arial" font-size="14.00">main runs after the type and function</text>
<text xml:space="preserve" text-anchor="start" x="669.74" y="-1237.6" font-family="Arial" font-size="14.00">definitions; these are consecutive source</text>
<text xml:space="preserve" text-anchor="start" x="669.74" y="-1223.6" font-family="Arial" font-size="14.00">excerpts.</text>
<text xml:space="preserve" text-anchor="start" x="669.74" y="-1195.6" font-family="Arial" font-weight="bold" font-size="14.00">WHY IT IS HERE</text>
<text xml:space="preserve" text-anchor="start" x="669.74" y="-1181.6" font-family="Arial" font-size="14.00">A fixed tree with one shared query lets the</text>
<text xml:space="preserve" text-anchor="start" x="669.74" y="-1167.6" font-family="Arial" font-size="14.00">same algorithm measure leaves and groups.</text>
<text xml:space="preserve" text-anchor="start" x="669.74" y="-1153.6" font-family="Arial" font-size="14.00">Bottom&#45;up construction and unique_ptr make</text>
<text xml:space="preserve" text-anchor="start" x="669.74" y="-1139.6" font-family="Arial" font-size="14.00">lifetime clear.</text>
<text xml:space="preserve" text-anchor="start" x="669.74" y="-1111.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT MUST STAY TRUE</text>
<text xml:space="preserve" text-anchor="start" x="669.74" y="-1097.6" font-family="Arial" font-size="14.00">Every child is non&#45;null and owned once.</text>
<text xml:space="preserve" text-anchor="start" x="669.74" y="-1069.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT CAN GO WRONG</text>
<text xml:space="preserve" text-anchor="start" x="669.74" y="-1055.6" font-family="Arial" font-size="14.00">Store total as a member and add to it on</text>
<text xml:space="preserve" text-anchor="start" x="669.74" y="-1041.6" font-family="Arial" font-size="14.00">every minutes call. For this nested tree,</text>
<text xml:space="preserve" text-anchor="start" x="669.74" y="-1027.6" font-family="Arial" font-size="14.00">repeated queries return 35, then 100,</text>
<text xml:space="preserve" text-anchor="start" x="669.74" y="-1013.6" font-family="Arial" font-size="14.00">instead of the same result. Both levels</text>
<text xml:space="preserve" text-anchor="start" x="669.74" y="-999.6" font-family="Arial" font-size="14.00">retain state: the inner group grows from 30</text>
<text xml:space="preserve" text-anchor="start" x="669.74" y="-985.6" font-family="Arial" font-size="14.00">to 60, and the outer grows from 35 by adding</text>
<text xml:space="preserve" text-anchor="start" x="669.74" y="-971.6" font-family="Arial" font-size="14.00">60 and 5.</text>
<text xml:space="preserve" text-anchor="start" x="669.74" y="-943.6" font-family="Arial" font-weight="bold" font-size="14.00">FIND THE CODE</text>
