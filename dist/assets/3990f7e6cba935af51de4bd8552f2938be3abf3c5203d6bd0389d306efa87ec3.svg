<text xml:space="preserve" text-anchor="start" x="611.94" y="-1321.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT THIS BLOCK MEANS</text>
<text xml:space="preserve" text-anchor="start" x="611.94" y="-1307.6" font-family="Arial" font-size="14.00">Enter the demonstration in the actual</text>
<text xml:space="preserve" text-anchor="start" x="611.94" y="-1293.6" font-family="Arial" font-size="14.00">demonstration, using the original program.</text>
<text xml:space="preserve" text-anchor="start" x="611.94" y="-1265.6" font-family="Arial" font-weight="bold" font-size="14.00">WHERE IT FITS</text>
<text xml:space="preserve" text-anchor="start" x="611.94" y="-1251.6" font-family="Arial" font-size="14.00">main runs after the type and function</text>
<text xml:space="preserve" text-anchor="start" x="611.94" y="-1237.6" font-family="Arial" font-size="14.00">definitions; these are consecutive source</text>
<text xml:space="preserve" text-anchor="start" x="611.94" y="-1223.6" font-family="Arial" font-size="14.00">excerpts.</text>
<text xml:space="preserve" text-anchor="start" x="611.94" y="-1195.6" font-family="Arial" font-weight="bold" font-size="14.00">WHY IT IS HERE</text>
<text xml:space="preserve" text-anchor="start" x="611.94" y="-1181.6" font-family="Arial" font-size="14.00">The base class holds the order and the error</text>
<text xml:space="preserve" text-anchor="start" x="611.94" y="-1167.6" font-family="Arial" font-size="14.00">boundaries. Derived classes only replace</text>
<text xml:space="preserve" text-anchor="start" x="611.94" y="-1153.6" font-family="Arial" font-size="14.00">conversion and, optionally, final</text>
<text xml:space="preserve" text-anchor="start" x="611.94" y="-1139.6" font-family="Arial" font-size="14.00">annotation.</text>
<text xml:space="preserve" text-anchor="start" x="611.94" y="-1111.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT MUST STAY TRUE</text>
<text xml:space="preserve" text-anchor="start" x="611.94" y="-1097.6" font-family="Arial" font-size="14.00">Every raw value is checked before the first</text>
<text xml:space="preserve" text-anchor="start" x="611.94" y="-1083.6" font-family="Arial" font-size="14.00">convert call.</text>
<text xml:space="preserve" text-anchor="start" x="611.94" y="-1055.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT CAN GO WRONG</text>
<text xml:space="preserve" text-anchor="start" x="611.94" y="-1041.6" font-family="Arial" font-size="14.00">Validate raw values only as they are</text>
<text xml:space="preserve" text-anchor="start" x="611.94" y="-1027.6" font-family="Arial" font-size="14.00">converted. With {3,&#45;1}, convert(3) runs</text>
<text xml:space="preserve" text-anchor="start" x="611.94" y="-1013.6" font-family="Arial" font-size="14.00">before &#45;1 is rejected. One pass changes the</text>
<text xml:space="preserve" text-anchor="start" x="611.94" y="-999.6" font-family="Arial" font-size="14.00">required order even if the final function</text>
<text xml:space="preserve" text-anchor="start" x="611.94" y="-985.6" font-family="Arial" font-size="14.00">still throws.</text>
