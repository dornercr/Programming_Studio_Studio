<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-labelledby="title desc"><title id="title">Linux in the Cloud</title><desc id="desc">Separate ephemeral instance state from the durable data, identity and declarations needed to rebuild the service.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#38bdf8"/></marker></defs><rect width="900" height="720" rx="22" fill="#0f172a"/><style>text{font-family:Arial,sans-serif;fill:#e2e8f0} .label{font-size:27px;font-weight:700} .note{font-size:21px}</style><rect x="65" y="50" width="770" height="86" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text class="label" x="100" y="103">1. Instance identity</text><path d="M450,138 V170" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/><rect x="65" y="180" width="770" height="86" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text class="label" x="100" y="233">2. Network and role</text><path d="M450,268 V300" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/><rect x="65" y="310" width="770" height="86" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text class="label" x="100" y="363">3. Persistent storage</text><path d="M450,398 V430" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/><rect x="65" y="440" width="770" height="86" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text class="label" x="100" y="493">4. Rebuild record</text><text class="note" x="50" y="600">Separate ephemeral instance state from the durable data, identity and</text><text class="note" x="50" y="628">declarations needed to rebuild the service.</text></svg>