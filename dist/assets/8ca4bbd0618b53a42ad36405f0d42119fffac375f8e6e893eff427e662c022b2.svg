<text xml:space="preserve" text-anchor="start" x="596.24" y="-1013.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT CAN GO WRONG</text>
<text xml:space="preserve" text-anchor="start" x="596.24" y="-999.6" font-family="Arial" font-size="14.00">Divide raw by integer 1000. A raw value of</text>
