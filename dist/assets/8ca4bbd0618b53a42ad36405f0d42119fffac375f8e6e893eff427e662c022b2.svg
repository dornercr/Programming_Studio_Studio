<text xml:space="preserve" text-anchor="start" x="596.24" y="-1265.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT THIS BLOCK MEANS</text>
<text xml:space="preserve" text-anchor="start" x="596.24" y="-1251.6" font-family="Arial" font-size="14.00">Enter the demonstration in the actual</text>
<text xml:space="preserve" text-anchor="start" x="596.24" y="-1237.6" font-family="Arial" font-size="14.00">demonstration, using the original program.</text>
<text xml:space="preserve" text-anchor="start" x="596.24" y="-1209.6" font-family="Arial" font-weight="bold" font-size="14.00">WHERE IT FITS</text>
<text xml:space="preserve" text-anchor="start" x="596.24" y="-1195.6" font-family="Arial" font-size="14.00">main runs after the type and function</text>
<text xml:space="preserve" text-anchor="start" x="596.24" y="-1181.6" font-family="Arial" font-size="14.00">definitions; these are consecutive source</text>
<text xml:space="preserve" text-anchor="start" x="596.24" y="-1167.6" font-family="Arial" font-size="14.00">excerpts.</text>
<text xml:space="preserve" text-anchor="start" x="596.24" y="-1139.6" font-family="Arial" font-weight="bold" font-size="14.00">WHY IT IS HERE</text>
<text xml:space="preserve" text-anchor="start" x="596.24" y="-1125.6" font-family="Arial" font-size="14.00">Use one borrowing adapter because the</text>
<text xml:space="preserve" text-anchor="start" x="596.24" y="-1111.6" font-family="Arial" font-size="14.00">existing rule depends on Scale and the</text>
<text xml:space="preserve" text-anchor="start" x="596.24" y="-1097.6" font-family="Arial" font-size="14.00">physical device already has an owner. Keep</text>
<text xml:space="preserve" text-anchor="start" x="596.24" y="-1083.6" font-family="Arial" font-size="14.00">conversion and device&#45;error checks together.</text>
<text xml:space="preserve" text-anchor="start" x="596.24" y="-1055.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT MUST STAY TRUE</text>
