<text xml:space="preserve" text-anchor="start" x="584.44" y="-1307.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT THIS BLOCK MEANS</text>
<text xml:space="preserve" text-anchor="start" x="584.44" y="-1293.6" font-family="Arial" font-size="14.00">Enter the demonstration in the actual</text>
<text xml:space="preserve" text-anchor="start" x="584.44" y="-1279.6" font-family="Arial" font-size="14.00">demonstration, using the original program.</text>
<text xml:space="preserve" text-anchor="start" x="584.44" y="-1251.6" font-family="Arial" font-weight="bold" font-size="14.00">WHERE IT FITS</text>
<text xml:space="preserve" text-anchor="start" x="584.44" y="-1237.6" font-family="Arial" font-size="14.00">main runs after the type and function</text>
<text xml:space="preserve" text-anchor="start" x="584.44" y="-1223.6" font-family="Arial" font-size="14.00">definitions; these are consecutive source</text>
<text xml:space="preserve" text-anchor="start" x="584.44" y="-1209.6" font-family="Arial" font-size="14.00">excerpts.</text>
<text xml:space="preserve" text-anchor="start" x="584.44" y="-1181.6" font-family="Arial" font-weight="bold" font-size="14.00">WHY IT IS HERE</text>
<text xml:space="preserve" text-anchor="start" x="584.44" y="-1167.6" font-family="Arial" font-size="14.00">One proxy keeps permission, lazy ownership,</text>
<text xml:space="preserve" text-anchor="start" x="584.44" y="-1153.6" font-family="Arial" font-size="14.00">and cache state beside the service access</text>
<text xml:space="preserve" text-anchor="start" x="584.44" y="-1139.6" font-family="Arial" font-size="14.00">they control. optional distinguishes no</text>
<text xml:space="preserve" text-anchor="start" x="584.44" y="-1125.6" font-family="Arial" font-size="14.00">result from a valid zero result.</text>
<text xml:space="preserve" text-anchor="start" x="584.44" y="-1097.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT MUST STAY TRUE</text>
<text xml:space="preserve" text-anchor="start" x="584.44" y="-1083.6" font-family="Arial" font-size="14.00">Denied reads never reach the service or</text>
<text xml:space="preserve" text-anchor="start" x="584.44" y="-1069.6" font-family="Arial" font-size="14.00">return cached data.</text>
<text xml:space="preserve" text-anchor="start" x="584.44" y="-1041.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT CAN GO WRONG</text>
<text xml:space="preserve" text-anchor="start" x="584.44" y="-1027.6" font-family="Arial" font-size="14.00">Use if (*cached_) to decide whether the</text>
<text xml:space="preserve" text-anchor="start" x="584.44" y="-1013.6" font-family="Arial" font-size="14.00">cache contains data. Dereferencing an empty</text>
<text xml:space="preserve" text-anchor="start" x="584.44" y="-999.6" font-family="Arial" font-size="14.00">optional is invalid; zero is also</text>
<text xml:space="preserve" text-anchor="start" x="584.44" y="-985.6" font-family="Arial" font-size="14.00">incorrectly treated as a miss. Value</text>
<text xml:space="preserve" text-anchor="start" x="584.44" y="-971.6" font-family="Arial" font-size="14.00">presence and numeric truth are different</text>
<text xml:space="preserve" text-anchor="start" x="584.44" y="-957.6" font-family="Arial" font-size="14.00">questions.</text>
