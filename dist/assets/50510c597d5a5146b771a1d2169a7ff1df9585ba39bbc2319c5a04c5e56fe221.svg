<text xml:space="preserve" text-anchor="start" x="615.44" y="-388.4" font-family="Arial" font-weight="bold" font-size="14.00">WHAT THIS BLOCK MEANS</text>
<text xml:space="preserve" text-anchor="start" x="615.44" y="-374.4" font-family="Arial" font-size="14.00">Observe checks and effects in the actual</text>
<text xml:space="preserve" text-anchor="start" x="615.44" y="-360.4" font-family="Arial" font-size="14.00">demonstration, using the original program.</text>
<text xml:space="preserve" text-anchor="start" x="615.44" y="-332.4" font-family="Arial" font-weight="bold" font-size="14.00">WHERE IT FITS</text>
<text xml:space="preserve" text-anchor="start" x="615.44" y="-318.4" font-family="Arial" font-size="14.00">main runs after the type and function</text>
