<text xml:space="preserve" text-anchor="start" x="615.44" y="-262.4" font-family="Arial" font-weight="bold" font-size="14.00">WHY IT IS HERE</text>
<text xml:space="preserve" text-anchor="start" x="615.44" y="-248.4" font-family="Arial" font-size="14.00">One proxy keeps permission, lazy ownership,</text>
<text xml:space="preserve" text-anchor="start" x="615.44" y="-234.4" font-family="Arial" font-size="14.00">and cache state beside the service access</text>
