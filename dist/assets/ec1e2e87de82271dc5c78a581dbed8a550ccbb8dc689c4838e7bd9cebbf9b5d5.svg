<text xml:space="preserve" text-anchor="start" x="634.84" y="-1335.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT THIS BLOCK MEANS</text>
<text xml:space="preserve" text-anchor="start" x="634.84" y="-1321.6" font-family="Arial" font-size="14.00">Enter the demonstration in the actual</text>
<text xml:space="preserve" text-anchor="start" x="634.84" y="-1307.6" font-family="Arial" font-size="14.00">demonstration, using the original program.</text>
<text xml:space="preserve" text-anchor="start" x="634.84" y="-1279.6" font-family="Arial" font-weight="bold" font-size="14.00">WHERE IT FITS</text>
<text xml:space="preserve" text-anchor="start" x="634.84" y="-1265.6" font-family="Arial" font-size="14.00">main runs after the type and function</text>
<text xml:space="preserve" text-anchor="start" x="634.84" y="-1251.6" font-family="Arial" font-size="14.00">definitions; these are consecutive source</text>
<text xml:space="preserve" text-anchor="start" x="634.84" y="-1237.6" font-family="Arial" font-size="14.00">excerpts.</text>
<text xml:space="preserve" text-anchor="start" x="634.84" y="-1209.6" font-family="Arial" font-weight="bold" font-size="14.00">WHY IT IS HERE</text>
<text xml:space="preserve" text-anchor="start" x="634.84" y="-1195.6" font-family="Arial" font-size="14.00">Move holds the receiver, destination, prior</text>
<text xml:space="preserve" text-anchor="start" x="634.84" y="-1181.6" font-family="Arial" font-size="14.00">position, and an applied flag. The queue</text>
<text xml:space="preserve" text-anchor="start" x="634.84" y="-1167.6" font-family="Arial" font-size="14.00">owns commands but borrows no internal marker</text>
<text xml:space="preserve" text-anchor="start" x="634.84" y="-1153.6" font-family="Arial" font-size="14.00">storage. Receiver validation happens before</text>
<text xml:space="preserve" text-anchor="start" x="634.84" y="-1139.6" font-family="Arial" font-size="14.00">the command commits success.</text>
<text xml:space="preserve" text-anchor="start" x="634.84" y="-1111.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT MUST STAY TRUE</text>
<text xml:space="preserve" text-anchor="start" x="634.84" y="-1097.6" font-family="Arial" font-size="14.00">The marker stays within its allowed range.</text>
<text xml:space="preserve" text-anchor="start" x="634.84" y="-1069.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT CAN GO WRONG</text>
<text xml:space="preserve" text-anchor="start" x="634.84" y="-1055.6" font-family="Arial" font-size="14.00">Capture before_ in the constructor. Both</text>
<text xml:space="preserve" text-anchor="start" x="634.84" y="-1041.6" font-family="Arial" font-size="14.00">queued moves may save zero, so undoing the</text>
<text xml:space="preserve" text-anchor="start" x="634.84" y="-1027.6" font-family="Arial" font-size="14.00">second jumps from seven directly to zero</text>
<text xml:space="preserve" text-anchor="start" x="634.84" y="-1013.6" font-family="Arial" font-size="14.00">instead of three. Both objects are</text>
<text xml:space="preserve" text-anchor="start" x="634.84" y="-999.6" font-family="Arial" font-size="14.00">constructed before either action executes.</text>
<text xml:space="preserve" text-anchor="start" x="634.84" y="-971.6" font-family="Arial" font-weight="bold" font-size="14.00">FIND THE CODE</text>
