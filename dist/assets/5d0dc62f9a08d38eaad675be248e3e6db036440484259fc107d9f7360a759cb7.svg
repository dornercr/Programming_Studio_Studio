<text xml:space="preserve" text-anchor="start" x="642.94" y="-1335.6" font-family="Arial" font-size="14.00">Enter the demonstration in the actual</text>
<text xml:space="preserve" text-anchor="start" x="642.94" y="-1321.6" font-family="Arial" font-size="14.00">demonstration, using the original program.</text>
<text xml:space="preserve" text-anchor="start" x="642.94" y="-1293.6" font-family="Arial" font-weight="bold" font-size="14.00">WHERE IT FITS</text>
<text xml:space="preserve" text-anchor="start" x="642.94" y="-1279.6" font-family="Arial" font-size="14.00">main runs after the type and function</text>
<text xml:space="preserve" text-anchor="start" x="642.94" y="-1265.6" font-family="Arial" font-size="14.00">definitions; these are consecutive source</text>
<text xml:space="preserve" text-anchor="start" x="642.94" y="-1251.6" font-family="Arial" font-size="14.00">excerpts.</text>
<text xml:space="preserve" text-anchor="start" x="642.94" y="-1223.6" font-family="Arial" font-weight="bold" font-size="14.00">WHY IT IS HERE</text>
<text xml:space="preserve" text-anchor="start" x="642.94" y="-1209.6" font-family="Arial" font-size="14.00">Monitor centralizes validation while</text>
<text xml:space="preserve" text-anchor="start" x="642.94" y="-1195.6" font-family="Arial" font-size="14.00">Estimate isolates the changing calculation.</text>
<text xml:space="preserve" text-anchor="start" x="642.94" y="-1181.6" font-family="Arial" font-size="14.00">Owning the selected rule avoids a</text>
<text xml:space="preserve" text-anchor="start" x="642.94" y="-1167.6" font-family="Arial" font-size="14.00">caller&#45;lifetime dependency and permits</text>
<text xml:space="preserve" text-anchor="start" x="642.94" y="-1153.6" font-family="Arial" font-size="14.00">replacement after construction.</text>
<text xml:space="preserve" text-anchor="start" x="642.94" y="-1125.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT MUST STAY TRUE</text>
<text xml:space="preserve" text-anchor="start" x="642.94" y="-1111.6" font-family="Arial" font-size="14.00">Every constructed Monitor owns a non&#45;null</text>
<text xml:space="preserve" text-anchor="start" x="642.94" y="-1097.6" font-family="Arial" font-size="14.00">strategy.</text>
<text xml:space="preserve" text-anchor="start" x="642.94" y="-1069.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT CAN GO WRONG</text>
<text xml:space="preserve" text-anchor="start" x="642.94" y="-1055.6" font-family="Arial" font-size="14.00">Assign a null handle before checking it. The</text>
<text xml:space="preserve" text-anchor="start" x="642.94" y="-1041.6" font-family="Arial" font-size="14.00">next read attempts to call through a null</text>
