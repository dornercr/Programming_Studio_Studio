<text xml:space="preserve" text-anchor="start" x="588.04" y="-1321.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT THIS BLOCK MEANS</text>
<text xml:space="preserve" text-anchor="start" x="588.04" y="-1307.6" font-family="Arial" font-size="14.00">Enter the demonstration in the actual</text>
<text xml:space="preserve" text-anchor="start" x="588.04" y="-1293.6" font-family="Arial" font-size="14.00">demonstration, using the original program.</text>
<text xml:space="preserve" text-anchor="start" x="588.04" y="-1265.6" font-family="Arial" font-weight="bold" font-size="14.00">WHERE IT FITS</text>
<text xml:space="preserve" text-anchor="start" x="588.04" y="-1251.6" font-family="Arial" font-size="14.00">main runs after the type and function</text>
<text xml:space="preserve" text-anchor="start" x="588.04" y="-1237.6" font-family="Arial" font-size="14.00">definitions; these are consecutive source</text>
<text xml:space="preserve" text-anchor="start" x="588.04" y="-1223.6" font-family="Arial" font-size="14.00">excerpts.</text>
<text xml:space="preserve" text-anchor="start" x="588.04" y="-1195.6" font-family="Arial" font-weight="bold" font-size="14.00">WHY IT IS HERE</text>
<text xml:space="preserve" text-anchor="start" x="588.04" y="-1181.6" font-family="Arial" font-size="14.00">Feed keeps weak registrations and locks each</text>
<text xml:space="preserve" text-anchor="start" x="588.04" y="-1167.6" font-family="Arial" font-size="14.00">one for the duration of its call. A scope</text>
<text xml:space="preserve" text-anchor="start" x="588.04" y="-1153.6" font-family="Arial" font-size="14.00">guard clears the in&#45;progress flag on all</text>
<text xml:space="preserve" text-anchor="start" x="588.04" y="-1139.6" font-family="Arial" font-size="14.00">exits. Callback errors stop delivery and</text>
<text xml:space="preserve" text-anchor="start" x="588.04" y="-1125.6" font-family="Arial" font-size="14.00">propagate without claiming rollback.</text>
<text xml:space="preserve" text-anchor="start" x="588.04" y="-1097.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT MUST STAY TRUE</text>
<text xml:space="preserve" text-anchor="start" x="588.04" y="-1083.6" font-family="Arial" font-size="14.00">Only a successfully locked listener receives</text>
<text xml:space="preserve" text-anchor="start" x="588.04" y="-1069.6" font-family="Arial" font-size="14.00">update.</text>
<text xml:space="preserve" text-anchor="start" x="588.04" y="-1041.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT CAN GO WRONG</text>
<text xml:space="preserve" text-anchor="start" x="588.04" y="-1027.6" font-family="Arial" font-size="14.00">Call a stored raw pointer after its view is</text>
<text xml:space="preserve" text-anchor="start" x="588.04" y="-1013.6" font-family="Arial" font-size="14.00">destroyed. The call uses a dead object and</text>
<text xml:space="preserve" text-anchor="start" x="588.04" y="-999.6" font-family="Arial" font-size="14.00">has undefined behavior. Registration does</text>
<text xml:space="preserve" text-anchor="start" x="588.04" y="-985.6" font-family="Arial" font-size="14.00">not itself establish a lifetime guarantee.</text>
<text xml:space="preserve" text-anchor="start" x="588.04" y="-957.6" font-family="Arial" font-weight="bold" font-size="14.00">FIND THE CODE</text>
<text xml:space="preserve" text-anchor="start" x="588.04" y="-943.6" font-family="Arial" font-size="14.00">companion/examples/ch18/main.cpp:61&#45;66</text>
