<text xml:space="preserve" text-anchor="start" x="630.94" y="-1293.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT THIS BLOCK MEANS</text>
<text xml:space="preserve" text-anchor="start" x="630.94" y="-1279.6" font-family="Arial" font-size="14.00">Enter the demonstration in the actual</text>
<text xml:space="preserve" text-anchor="start" x="630.94" y="-1265.6" font-family="Arial" font-size="14.00">demonstration, using the original program.</text>
<text xml:space="preserve" text-anchor="start" x="630.94" y="-1237.6" font-family="Arial" font-weight="bold" font-size="14.00">WHERE IT FITS</text>
<text xml:space="preserve" text-anchor="start" x="630.94" y="-1223.6" font-family="Arial" font-size="14.00">main runs after the type and function</text>
<text xml:space="preserve" text-anchor="start" x="630.94" y="-1209.6" font-family="Arial" font-size="14.00">definitions; these are consecutive source</text>
<text xml:space="preserve" text-anchor="start" x="630.94" y="-1195.6" font-family="Arial" font-size="14.00">excerpts.</text>
<text xml:space="preserve" text-anchor="start" x="630.94" y="-1167.6" font-family="Arial" font-weight="bold" font-size="14.00">WHY IT IS HERE</text>
<text xml:space="preserve" text-anchor="start" x="630.94" y="-1153.6" font-family="Arial" font-size="14.00">ArchiveJob owns a useful stable workflow and</text>
<text xml:space="preserve" text-anchor="start" x="630.94" y="-1139.6" font-family="Arial" font-size="14.00">exposes one protected virtual creation hook.</text>
<text xml:space="preserve" text-anchor="start" x="630.94" y="-1125.6" font-family="Arial" font-size="14.00">Concrete jobs select products; the workflow</text>
<text xml:space="preserve" text-anchor="start" x="630.94" y="-1111.6" font-family="Arial" font-size="14.00">sees only Record.</text>
<text xml:space="preserve" text-anchor="start" x="630.94" y="-1083.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT MUST STAY TRUE</text>
<text xml:space="preserve" text-anchor="start" x="630.94" y="-1069.6" font-family="Arial" font-size="14.00">run validates before it calls make.</text>
<text xml:space="preserve" text-anchor="start" x="630.94" y="-1041.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT CAN GO WRONG</text>
<text xml:space="preserve" text-anchor="start" x="630.94" y="-1027.6" font-family="Arial" font-size="14.00">Construct TextRecord directly in</text>
<text xml:space="preserve" text-anchor="start" x="630.94" y="-1013.6" font-family="Arial" font-size="14.00">ArchiveJob::run. BracketJob still produces</text>
<text xml:space="preserve" text-anchor="start" x="630.94" y="-999.6" font-family="Arial" font-size="14.00">stored text:sample instead of stored</text>
<text xml:space="preserve" text-anchor="start" x="630.94" y="-985.6" font-family="Arial" font-size="14.00">[sample]. The workflow bypasses the virtual</text>
