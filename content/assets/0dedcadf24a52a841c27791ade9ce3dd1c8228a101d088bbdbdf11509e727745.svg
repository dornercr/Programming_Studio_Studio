<text xml:space="preserve" text-anchor="start" x="579.84" y="-1265.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT THIS BLOCK MEANS</text>
<text xml:space="preserve" text-anchor="start" x="579.84" y="-1251.6" font-family="Arial" font-size="14.00">Enter the demonstration in the actual</text>
<text xml:space="preserve" text-anchor="start" x="579.84" y="-1237.6" font-family="Arial" font-size="14.00">demonstration, using the original program.</text>
<text xml:space="preserve" text-anchor="start" x="579.84" y="-1209.6" font-family="Arial" font-weight="bold" font-size="14.00">WHERE IT FITS</text>
<text xml:space="preserve" text-anchor="start" x="579.84" y="-1195.6" font-family="Arial" font-size="14.00">main runs after the type and function</text>
<text xml:space="preserve" text-anchor="start" x="579.84" y="-1181.6" font-family="Arial" font-size="14.00">definitions; these are consecutive source</text>
<text xml:space="preserve" text-anchor="start" x="579.84" y="-1167.6" font-family="Arial" font-size="14.00">excerpts.</text>
<text xml:space="preserve" text-anchor="start" x="579.84" y="-1139.6" font-family="Arial" font-weight="bold" font-size="14.00">WHY IT IS HERE</text>
<text xml:space="preserve" text-anchor="start" x="579.84" y="-1125.6" font-family="Arial" font-size="14.00">Two report types share a Writer interface</text>
<text xml:space="preserve" text-anchor="start" x="579.84" y="-1111.6" font-family="Arial" font-size="14.00">because report policy and field formatting</text>
<text xml:space="preserve" text-anchor="start" x="579.84" y="-1097.6" font-family="Arial" font-size="14.00">change for different reasons. Constructors</text>
<text xml:space="preserve" text-anchor="start" x="579.84" y="-1083.6" font-family="Arial" font-size="14.00">make each pairing explicit.</text>
<text xml:space="preserve" text-anchor="start" x="579.84" y="-1055.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT MUST STAY TRUE</text>
<text xml:space="preserve" text-anchor="start" x="579.84" y="-1041.6" font-family="Arial" font-size="14.00">Reports never change a writer or own its</text>
<text xml:space="preserve" text-anchor="start" x="579.84" y="-1027.6" font-family="Arial" font-size="14.00">lifetime.</text>
<text xml:space="preserve" text-anchor="start" x="579.84" y="-999.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT CAN GO WRONG</text>
<text xml:space="preserve" text-anchor="start" x="579.84" y="-985.6" font-family="Arial" font-size="14.00">Duplicate the warning threshold in every</text>
<text xml:space="preserve" text-anchor="start" x="579.84" y="-971.6" font-family="Arial" font-size="14.00">writer. One format may print high for 6</text>
<text xml:space="preserve" text-anchor="start" x="579.84" y="-957.6" font-family="Arial" font-size="14.00">while another prints normal. A domain rule</text>
<text xml:space="preserve" text-anchor="start" x="579.84" y="-943.6" font-family="Arial" font-size="14.00">has been scattered across format</text>
<text xml:space="preserve" text-anchor="start" x="579.84" y="-929.6" font-family="Arial" font-size="14.00">implementations.</text>
<text xml:space="preserve" text-anchor="start" x="579.84" y="-901.6" font-family="Arial" font-weight="bold" font-size="14.00">FIND THE CODE</text>
<text xml:space="preserve" text-anchor="start" x="579.84" y="-887.6" font-family="Arial" font-size="14.00">companion/examples/ch07/main.cpp:62&#45;67</text>
