<text xml:space="preserve" text-anchor="start" x="497.93" y="-1349.6" font-family="Arial" font-size="14.00">Enter the demonstration in the actual</text>
<text xml:space="preserve" text-anchor="start" x="497.93" y="-1335.6" font-family="Arial" font-size="14.00">demonstration, using the original program.</text>
<text xml:space="preserve" text-anchor="start" x="497.93" y="-1307.6" font-family="Arial" font-weight="bold" font-size="14.00">WHERE IT FITS</text>
<text xml:space="preserve" text-anchor="start" x="497.93" y="-1293.6" font-family="Arial" font-size="14.00">main runs after the type and function</text>
<text xml:space="preserve" text-anchor="start" x="497.93" y="-1279.6" font-family="Arial" font-size="14.00">definitions; these are consecutive source</text>
