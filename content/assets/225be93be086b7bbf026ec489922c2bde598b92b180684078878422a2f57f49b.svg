<text xml:space="preserve" text-anchor="start" x="497.93" y="-1237.6" font-family="Arial" font-weight="bold" font-size="14.00">WHY IT IS HERE</text>
<text xml:space="preserve" text-anchor="start" x="497.93" y="-1223.6" font-family="Arial" font-size="14.00">Each state returns a proposed next state.</text>
<text xml:space="preserve" text-anchor="start" x="497.93" y="-1209.6" font-family="Arial" font-size="14.00">Session owns the current state and commits</text>
<text xml:space="preserve" text-anchor="start" x="497.93" y="-1195.6" font-family="Arial" font-size="14.00">the replacement after the call completes.</text>
<text xml:space="preserve" text-anchor="start" x="497.93" y="-1181.6" font-family="Arial" font-size="14.00">Returning no pointer is an ordinary rejected</text>
<text xml:space="preserve" text-anchor="start" x="497.93" y="-1167.6" font-family="Arial" font-size="14.00">event.</text>
<text xml:space="preserve" text-anchor="start" x="497.93" y="-1139.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT MUST STAY TRUE</text>
<text xml:space="preserve" text-anchor="start" x="497.93" y="-1125.6" font-family="Arial" font-size="14.00">Session owns exactly one live state during</text>
<text xml:space="preserve" text-anchor="start" x="497.93" y="-1111.6" font-family="Arial" font-size="14.00">public calls.</text>
<text xml:space="preserve" text-anchor="start" x="497.93" y="-1083.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT CAN GO WRONG</text>
<text xml:space="preserve" text-anchor="start" x="497.93" y="-1069.6" font-family="Arial" font-size="14.00">Destroy the current state inside its</text>
