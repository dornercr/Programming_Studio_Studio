<text xml:space="preserve" text-anchor="start" x="583.94" y="-1251.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT THIS BLOCK MEANS</text>
<text xml:space="preserve" text-anchor="start" x="583.94" y="-1237.6" font-family="Arial" font-size="14.00">Enter the demonstration in the actual</text>
<text xml:space="preserve" text-anchor="start" x="583.94" y="-1223.6" font-family="Arial" font-size="14.00">demonstration, using the original program.</text>
<text xml:space="preserve" text-anchor="start" x="583.94" y="-1195.6" font-family="Arial" font-weight="bold" font-size="14.00">WHERE IT FITS</text>
<text xml:space="preserve" text-anchor="start" x="583.94" y="-1181.6" font-family="Arial" font-size="14.00">main runs after the type and function</text>
<text xml:space="preserve" text-anchor="start" x="583.94" y="-1167.6" font-family="Arial" font-size="14.00">definitions; these are consecutive source</text>
<text xml:space="preserve" text-anchor="start" x="583.94" y="-1153.6" font-family="Arial" font-size="14.00">excerpts.</text>
<text xml:space="preserve" text-anchor="start" x="583.94" y="-1125.6" font-family="Arial" font-weight="bold" font-size="14.00">WHY IT IS HERE</text>
<text xml:space="preserve" text-anchor="start" x="583.94" y="-1111.6" font-family="Arial" font-size="14.00">A map interns immutable Style objects by a</text>
<text xml:space="preserve" text-anchor="start" x="583.94" y="-1097.6" font-family="Arial" font-size="14.00">complete structured key. shared_ptr allows</text>
<text xml:space="preserve" text-anchor="start" x="583.94" y="-1083.6" font-family="Arial" font-size="14.00">marks to retain styles after a pool is</text>
<text xml:space="preserve" text-anchor="start" x="583.94" y="-1069.6" font-family="Arial" font-size="14.00">destroyed.</text>
<text xml:space="preserve" text-anchor="start" x="583.94" y="-1041.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT MUST STAY TRUE</text>
<text xml:space="preserve" text-anchor="start" x="583.94" y="-1027.6" font-family="Arial" font-size="14.00">One active pool returns the same object for</text>
<text xml:space="preserve" text-anchor="start" x="583.94" y="-1013.6" font-family="Arial" font-size="14.00">the same key.</text>
<text xml:space="preserve" text-anchor="start" x="583.94" y="-985.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT CAN GO WRONG</text>
<text xml:space="preserve" text-anchor="start" x="583.94" y="-971.6" font-family="Arial" font-size="14.00">Use only name as the pool key. A request for</text>
<text xml:space="preserve" text-anchor="start" x="583.94" y="-957.6" font-family="Arial" font-size="14.00">dot/20 can incorrectly receive the existing</text>
<text xml:space="preserve" text-anchor="start" x="583.94" y="-943.6" font-family="Arial" font-size="14.00">dot/12 style. The key does not include all</text>
<text xml:space="preserve" text-anchor="start" x="583.94" y="-929.6" font-family="Arial" font-size="14.00">intrinsic state.</text>
<text xml:space="preserve" text-anchor="start" x="583.94" y="-901.6" font-family="Arial" font-weight="bold" font-size="14.00">FIND THE CODE</text>
