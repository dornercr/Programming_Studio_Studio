<text xml:space="preserve" text-anchor="start" x="653.94" y="-374.4" font-family="Arial" font-weight="bold" font-size="14.00">WHAT THIS BLOCK MEANS</text>
<text xml:space="preserve" text-anchor="start" x="653.94" y="-360.4" font-family="Arial" font-size="14.00">Observe checks and effects in the actual</text>
<text xml:space="preserve" text-anchor="start" x="653.94" y="-346.4" font-family="Arial" font-size="14.00">demonstration, using the original program.</text>
<text xml:space="preserve" text-anchor="start" x="653.94" y="-318.4" font-family="Arial" font-weight="bold" font-size="14.00">WHERE IT FITS</text>
<text xml:space="preserve" text-anchor="start" x="653.94" y="-304.4" font-family="Arial" font-size="14.00">main runs after the type and function</text>
<text xml:space="preserve" text-anchor="start" x="653.94" y="-290.4" font-family="Arial" font-size="14.00">definitions; these are consecutive source</text>
<text xml:space="preserve" text-anchor="start" x="653.94" y="-276.4" font-family="Arial" font-size="14.00">excerpts.</text>
<text xml:space="preserve" text-anchor="start" x="653.94" y="-248.4" font-family="Arial" font-weight="bold" font-size="14.00">WHY IT IS HERE</text>
<text xml:space="preserve" text-anchor="start" x="653.94" y="-234.4" font-family="Arial" font-size="14.00">A map interns immutable Style objects by a</text>
<text xml:space="preserve" text-anchor="start" x="653.94" y="-220.4" font-family="Arial" font-size="14.00">complete structured key. shared_ptr allows</text>
<text xml:space="preserve" text-anchor="start" x="653.94" y="-206.4" font-family="Arial" font-size="14.00">marks to retain styles after a pool is</text>
<text xml:space="preserve" text-anchor="start" x="653.94" y="-192.4" font-family="Arial" font-size="14.00">destroyed.</text>
<text xml:space="preserve" text-anchor="start" x="653.94" y="-164.4" font-family="Arial" font-weight="bold" font-size="14.00">WHAT MUST STAY TRUE</text>
<text xml:space="preserve" text-anchor="start" x="653.94" y="-150.4" font-family="Arial" font-size="14.00">Each Mark owns its own position and shares</text>
<text xml:space="preserve" text-anchor="start" x="653.94" y="-136.4" font-family="Arial" font-size="14.00">only intrinsic style state.</text>
<text xml:space="preserve" text-anchor="start" x="653.94" y="-108.4" font-family="Arial" font-weight="bold" font-size="14.00">WHAT CAN GO WRONG</text>
<text xml:space="preserve" text-anchor="start" x="653.94" y="-94.4" font-family="Arial" font-size="14.00">Return a raw pointer to a pool&#45;owned object,</text>
<text xml:space="preserve" text-anchor="start" x="653.94" y="-80.4" font-family="Arial" font-size="14.00">then destroy the pool. A later Mark draw may</text>
<text xml:space="preserve" text-anchor="start" x="653.94" y="-66.4" font-family="Arial" font-size="14.00">dereference a destroyed Style. A raw borrow</text>
<text xml:space="preserve" text-anchor="start" x="653.94" y="-52.4" font-family="Arial" font-size="14.00">does not preserve shared lifetime.</text>
<text xml:space="preserve" text-anchor="start" x="653.94" y="-24.4" font-family="Arial" font-weight="bold" font-size="14.00">FIND THE CODE</text>
<text xml:space="preserve" text-anchor="start" x="653.94" y="-10.4" font-family="Arial" font-size="14.00">companion/examples/ch11/main.cpp:68&#45;73</text>
