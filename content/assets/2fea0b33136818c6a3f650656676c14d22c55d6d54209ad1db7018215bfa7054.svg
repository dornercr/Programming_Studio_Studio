<text xml:space="preserve" text-anchor="start" x="747.75" y="-1265.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT THIS BLOCK MEANS</text>
<text xml:space="preserve" text-anchor="start" x="747.75" y="-1251.6" font-family="Arial" font-size="14.00">Enter the demonstration in the actual</text>
<text xml:space="preserve" text-anchor="start" x="747.75" y="-1237.6" font-family="Arial" font-size="14.00">demonstration, using the original program.</text>
<text xml:space="preserve" text-anchor="start" x="747.75" y="-1209.6" font-family="Arial" font-weight="bold" font-size="14.00">WHERE IT FITS</text>
<text xml:space="preserve" text-anchor="start" x="747.75" y="-1195.6" font-family="Arial" font-size="14.00">main runs after the type and function</text>
<text xml:space="preserve" text-anchor="start" x="747.75" y="-1181.6" font-family="Arial" font-size="14.00">definitions; these are consecutive source</text>
<text xml:space="preserve" text-anchor="start" x="747.75" y="-1167.6" font-family="Arial" font-size="14.00">excerpts.</text>
<text xml:space="preserve" text-anchor="start" x="747.75" y="-1139.6" font-family="Arial" font-weight="bold" font-size="14.00">WHY IT IS HERE</text>
<text xml:space="preserve" text-anchor="start" x="747.75" y="-1125.6" font-family="Arial" font-size="14.00">Each wrapper owns exactly one Message and</text>
<text xml:space="preserve" text-anchor="start" x="747.75" y="-1111.6" font-family="Arial" font-size="14.00">implements the same query. Ownership makes</text>
<text xml:space="preserve" text-anchor="start" x="747.75" y="-1097.6" font-family="Arial" font-size="14.00">the assembled chain self&#45;contained; explicit</text>
<text xml:space="preserve" text-anchor="start" x="747.75" y="-1083.6" font-family="Arial" font-size="14.00">nesting makes order reviewable.</text>
<text xml:space="preserve" text-anchor="start" x="747.75" y="-1055.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT MUST STAY TRUE</text>
<text xml:space="preserve" text-anchor="start" x="747.75" y="-1041.6" font-family="Arial" font-size="14.00">Every wrapper has one non&#45;null inner owner.</text>
