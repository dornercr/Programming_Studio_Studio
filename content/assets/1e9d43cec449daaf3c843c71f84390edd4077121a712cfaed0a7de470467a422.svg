<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="790" viewBox="0 0 1260 790"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#7955ac" stroke-width="1.5"/></marker></defs><rect width="1260" height="790" fill="#fcfbff"/><rect x="15" y="15" width="400" height="125" rx="12" fill="#eee4f7" stroke="#b9a3d2"/><text x="215" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold">Owner construction</text><text x="30" y="78" font-family="ui-monospace,Consolas,monospace" font-size="12">if (fail) throw std::runtime_error(&quot;construction&quot;);</text><text x="30" y="101" font-family="ui-monospace,Consolas,monospace" font-size="12">// Failure path: owner never completes.</text><path d="M215 141 V730" stroke="#b9a3d2" stroke-dasharray="6 6"/><rect x="430" y="15" width="400" height="125" rx="12" fill="#eee4f7" stroke="#b9a3d2"/><text x="630" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold">Completed members A and B</text><text x="445" y="78" font-family="ui-monospace,Consolas,monospace" font-size="12">LoggedMember a, b;</text><text x="445" y="101" font-family="ui-monospace,Consolas,monospace" font-size="12">// Destruction runs B, then A.</text><path d="M630 141 V730" stroke="#b9a3d2" stroke-dasharray="6 6"/><rect x="845" y="15" width="400" height="125" rx="12" fill="#eee4f7" stroke="#b9a3d2"/><text x="1045" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold">Caller-owned log</text><text x="860" y="78" font-family="ui-monospace,Consolas,monospace" font-size="12">std::vector&lt;std::string&gt; log;</text><text x="860" y="101" font-family="ui-monospace,Consolas,monospace" font-size="12">// Lives through the catch handler.</text><path d="M1045 141 V730" stroke="#b9a3d2" stroke-dasharray="6 6"/><line x1="215" y1="203" x2="630" y2="203" stroke="#7955ac" stroke-width="2" marker-end="url(#arrow)"/><text x="422.5" y="191" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#453252">1. construct A, then B</text><line x1="630" y1="286" x2="1045" y2="286" stroke="#7955ac" stroke-width="2" marker-end="url(#arrow)"/><text x="837.5" y="274" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#453252">2. record A+, then B+</text><line x1="215" y1="369" x2="1045" y2="369" stroke="#7955ac" stroke-width="2" marker-end="url(#arrow)"/><text x="630" y="357" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#453252">3. record body</text><line x1="215" y1="452" x2="630" y2="452" stroke="#7955ac" stroke-width="2" marker-end="url(#arrow)"/><text x="422.5" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#453252">4. constructor throws; unwind</text><line x1="630" y1="535" x2="1045" y2="535" stroke="#7955ac" stroke-width="2" marker-end="url(#arrow)"/><text x="837.5" y="523" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#453252">5. destroy B, then A: B- A-</text><line x1="215" y1="618" x2="1045" y2="618" stroke="#7955ac" stroke-width="2" marker-end="url(#arrow)"/><text x="630" y="606" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#453252">6. caller catch records caught</text><text x="20" y="775" font-family="Arial,sans-serif" font-size="14" fill="#765b86">Teaching annotation: there is no owner- entry on this failure path; the owner never completed construction.</text></svg>