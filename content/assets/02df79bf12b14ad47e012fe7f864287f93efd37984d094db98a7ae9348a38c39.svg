<text xml:space="preserve" text-anchor="start" x="666.54" y="-1293.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT THIS BLOCK MEANS</text>
<text xml:space="preserve" text-anchor="start" x="666.54" y="-1279.6" font-family="Arial" font-size="14.00">Enter the demonstration in the actual</text>
<text xml:space="preserve" text-anchor="start" x="666.54" y="-1265.6" font-family="Arial" font-size="14.00">demonstration, using the original program.</text>
<text xml:space="preserve" text-anchor="start" x="666.54" y="-1237.6" font-family="Arial" font-weight="bold" font-size="14.00">WHERE IT FITS</text>
<text xml:space="preserve" text-anchor="start" x="666.54" y="-1223.6" font-family="Arial" font-size="14.00">main runs after the type and function</text>
<text xml:space="preserve" text-anchor="start" x="666.54" y="-1209.6" font-family="Arial" font-size="14.00">definitions; these are consecutive source</text>
<text xml:space="preserve" text-anchor="start" x="666.54" y="-1195.6" font-family="Arial" font-size="14.00">excerpts.</text>
<text xml:space="preserve" text-anchor="start" x="666.54" y="-1167.6" font-family="Arial" font-weight="bold" font-size="14.00">WHY IT IS HERE</text>
<text xml:space="preserve" text-anchor="start" x="666.54" y="-1153.6" font-family="Arial" font-size="14.00">One facade method fixes the call order while</text>
<text xml:space="preserve" text-anchor="start" x="666.54" y="-1139.6" font-family="Arial" font-size="14.00">member objects retain separate parsing,</text>
<text xml:space="preserve" text-anchor="start" x="666.54" y="-1125.6" font-family="Arial" font-size="14.00">validation, and calculation</text>
<text xml:space="preserve" text-anchor="start" x="666.54" y="-1111.6" font-family="Arial" font-size="14.00">responsibilities. No polymorphism is needed.</text>
<text xml:space="preserve" text-anchor="start" x="666.54" y="-1083.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT MUST STAY TRUE</text>
<text xml:space="preserve" text-anchor="start" x="666.54" y="-1069.6" font-family="Arial" font-size="14.00">Malformed tokens never become accepted</text>
<text xml:space="preserve" text-anchor="start" x="666.54" y="-1055.6" font-family="Arial" font-size="14.00">partial integers.</text>
<text xml:space="preserve" text-anchor="start" x="666.54" y="-1027.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT CAN GO WRONG</text>
<text xml:space="preserve" text-anchor="start" x="666.54" y="-1013.6" font-family="Arial" font-size="14.00">Check only from_chars.ec and ignore its</text>
<text xml:space="preserve" text-anchor="start" x="666.54" y="-999.6" font-family="Arial" font-size="14.00">stopping pointer. The malformed token 4x may</text>
<text xml:space="preserve" text-anchor="start" x="666.54" y="-985.6" font-family="Arial" font-size="14.00">be accepted as 4. A valid numeric prefix is</text>
<text xml:space="preserve" text-anchor="start" x="666.54" y="-971.6" font-family="Arial" font-size="14.00">not a valid complete token.</text>
