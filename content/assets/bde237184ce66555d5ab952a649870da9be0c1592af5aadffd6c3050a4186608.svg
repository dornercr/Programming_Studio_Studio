<text xml:space="preserve" text-anchor="start" x="580.24" y="-1307.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT THIS BLOCK MEANS</text>
<text xml:space="preserve" text-anchor="start" x="580.24" y="-1293.6" font-family="Arial" font-size="14.00">Enter the demonstration in the actual</text>
<text xml:space="preserve" text-anchor="start" x="580.24" y="-1279.6" font-family="Arial" font-size="14.00">demonstration, using the original program.</text>
<text xml:space="preserve" text-anchor="start" x="580.24" y="-1251.6" font-family="Arial" font-weight="bold" font-size="14.00">WHERE IT FITS</text>
<text xml:space="preserve" text-anchor="start" x="580.24" y="-1237.6" font-family="Arial" font-size="14.00">main runs after the type and function</text>
<text xml:space="preserve" text-anchor="start" x="580.24" y="-1223.6" font-family="Arial" font-size="14.00">definitions; these are consecutive source</text>
<text xml:space="preserve" text-anchor="start" x="580.24" y="-1209.6" font-family="Arial" font-size="14.00">excerpts.</text>
<text xml:space="preserve" text-anchor="start" x="580.24" y="-1181.6" font-family="Arial" font-weight="bold" font-size="14.00">WHY IT IS HERE</text>
<text xml:space="preserve" text-anchor="start" x="580.24" y="-1167.6" font-family="Arial" font-size="14.00">Form owns its controls and implements a</text>
<text xml:space="preserve" text-anchor="start" x="580.24" y="-1153.6" font-family="Arial" font-size="14.00">small Events interface. The field reports</text>
<text xml:space="preserve" text-anchor="start" x="580.24" y="-1139.6" font-family="Arial" font-size="14.00">changes, the mediator reads all relevant</text>
<text xml:space="preserve" text-anchor="start" x="580.24" y="-1125.6" font-family="Arial" font-size="14.00">state, and the button updates silently.</text>
<text xml:space="preserve" text-anchor="start" x="580.24" y="-1097.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT MUST STAY TRUE</text>
<text xml:space="preserve" text-anchor="start" x="580.24" y="-1083.6" font-family="Arial" font-size="14.00">Button readiness equals filled name AND</text>
<text xml:space="preserve" text-anchor="start" x="580.24" y="-1069.6" font-family="Arial" font-size="14.00">accepted consent after each public change.</text>
<text xml:space="preserve" text-anchor="start" x="580.24" y="-1041.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT CAN GO WRONG</text>
<text xml:space="preserve" text-anchor="start" x="580.24" y="-1027.6" font-family="Arial" font-size="14.00">NameField enables save whenever text is</text>
<text xml:space="preserve" text-anchor="start" x="580.24" y="-1013.6" font-family="Arial" font-size="14.00">nonempty. Entering Mina can enable save</text>
<text xml:space="preserve" text-anchor="start" x="580.24" y="-999.6" font-family="Arial" font-size="14.00">while consent is false. One component cannot</text>
<text xml:space="preserve" text-anchor="start" x="580.24" y="-985.6" font-family="Arial" font-size="14.00">decide a rule that also depends on another</text>
<text xml:space="preserve" text-anchor="start" x="580.24" y="-971.6" font-family="Arial" font-size="14.00">state.</text>
