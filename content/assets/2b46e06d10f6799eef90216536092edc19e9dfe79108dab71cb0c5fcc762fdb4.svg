<text xml:space="preserve" text-anchor="start" x="701.65" y="-1349.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT THIS BLOCK MEANS</text>
<text xml:space="preserve" text-anchor="start" x="701.65" y="-1335.6" font-family="Arial" font-size="14.00">Enter the demonstration in the actual</text>
<text xml:space="preserve" text-anchor="start" x="701.65" y="-1321.6" font-family="Arial" font-size="14.00">demonstration, using the original program.</text>
<text xml:space="preserve" text-anchor="start" x="701.65" y="-1293.6" font-family="Arial" font-weight="bold" font-size="14.00">WHERE IT FITS</text>
<text xml:space="preserve" text-anchor="start" x="701.65" y="-1279.6" font-family="Arial" font-size="14.00">main runs after the type and function</text>
<text xml:space="preserve" text-anchor="start" x="701.65" y="-1265.6" font-family="Arial" font-size="14.00">definitions; these are consecutive source</text>
<text xml:space="preserve" text-anchor="start" x="701.65" y="-1251.6" font-family="Arial" font-size="14.00">excerpts.</text>
<text xml:space="preserve" text-anchor="start" x="701.65" y="-1223.6" font-family="Arial" font-weight="bold" font-size="14.00">WHY IT IS HERE</text>
<text xml:space="preserve" text-anchor="start" x="701.65" y="-1209.6" font-family="Arial" font-size="14.00">Store small function handlers in a vector</text>
<text xml:space="preserve" text-anchor="start" x="701.65" y="-1195.6" font-family="Arial" font-size="14.00">and use an optional destination. The vector</text>
<text xml:space="preserve" text-anchor="start" x="701.65" y="-1181.6" font-family="Arial" font-size="14.00">makes order visible; the optional result</text>
<text xml:space="preserve" text-anchor="start" x="701.65" y="-1167.6" font-family="Arial" font-size="14.00">separates a decline from an accepted</text>
<text xml:space="preserve" text-anchor="start" x="701.65" y="-1153.6" font-family="Arial" font-size="14.00">request. One route function owns the</text>
<text xml:space="preserve" text-anchor="start" x="701.65" y="-1139.6" font-family="Arial" font-size="14.00">stopping rule.</text>
<text xml:space="preserve" text-anchor="start" x="701.65" y="-1111.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT MUST STAY TRUE</text>
<text xml:space="preserve" text-anchor="start" x="701.65" y="-1097.6" font-family="Arial" font-size="14.00">A valid job receives at most one</text>
<text xml:space="preserve" text-anchor="start" x="701.65" y="-1083.6" font-family="Arial" font-size="14.00">destination.</text>
<text xml:space="preserve" text-anchor="start" x="701.65" y="-1055.6" font-family="Arial" font-weight="bold" font-size="14.00">WHAT CAN GO WRONG</text>
<text xml:space="preserve" text-anchor="start" x="701.65" y="-1041.6" font-family="Arial" font-size="14.00">Continue through the vector after finding a</text>
<text xml:space="preserve" text-anchor="start" x="701.65" y="-1027.6" font-family="Arial" font-size="14.00">destination. A label job can finish as</text>
<text xml:space="preserve" text-anchor="start" x="701.65" y="-1013.6" font-family="Arial" font-size="14.00">general desk instead of label desk. The two</text>
<text xml:space="preserve" text-anchor="start" x="701.65" y="-999.6" font-family="Arial" font-size="14.00">handlers overlap, so the last answer</text>
<text xml:space="preserve" text-anchor="start" x="701.65" y="-985.6" font-family="Arial" font-size="14.00">replaces the first.</text>
