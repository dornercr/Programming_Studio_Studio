<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="508" viewBox="0 0 1060 508"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#6246ba" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fcfcff"/><rect x="69" y="12" width="232" height="116" rx="10" fill="#eee9fb" stroke="#b7a9df"/><text x="185" y="35" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#302b48">Monitor::ingest</text><text x="185" y="61" text-anchor="middle" font-family="monospace" font-size="10" fill="#302b48">auto staged = records_;</text><text x="185" y="75" text-anchor="middle" font-family="monospace" font-size="10" fill="#302b48">// Live history stays</text><text x="185" y="89" text-anchor="middle" font-family="monospace" font-size="10" fill="#302b48">unchanged.</text><path d="M185 129 V476" stroke="#aaa1bc" stroke-dasharray="5 5"/><rect x="299" y="12" width="232" height="116" rx="10" fill="#eee9fb" stroke="#b7a9df"/><text x="415" y="35" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#302b48">SampleAdapter::convert</text><text x="415" y="61" text-anchor="middle" font-family="monospace" font-size="10" fill="#302b48">return {raw.id, c};</text><text x="415" y="75" text-anchor="middle" font-family="monospace" font-size="10" fill="#302b48">// Returns one normalized</text><text x="415" y="89" text-anchor="middle" font-family="monospace" font-size="10" fill="#302b48">value.</text><path d="M415 129 V476" stroke="#aaa1bc" stroke-dasharray="5 5"/><rect x="529" y="12" width="232" height="116" rx="10" fill="#eee9fb" stroke="#b7a9df"/><text x="645" y="35" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#302b48">AlertRule::alert</text><text x="645" y="61" text-anchor="middle" font-family="monospace" font-size="10" fill="#302b48">return s.celsius &gt;= limit_;</text><text x="645" y="75" text-anchor="middle" font-family="monospace" font-size="10" fill="#302b48">// Concrete AtLeast</text><text x="645" y="89" text-anchor="middle" font-family="monospace" font-size="10" fill="#302b48">implementation.</text><path d="M645 129 V476" stroke="#aaa1bc" stroke-dasharray="5 5"/><rect x="759" y="12" width="232" height="116" rx="10" fill="#eee9fb" stroke="#b7a9df"/><text x="875" y="35" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#302b48">Staged vector</text><text x="875" y="61" text-anchor="middle" font-family="monospace" font-size="10" fill="#302b48">staged.push_back({s, hot});</text><text x="875" y="75" text-anchor="middle" font-family="monospace" font-size="10" fill="#302b48">// Receives the proposed</text><text x="875" y="89" text-anchor="middle" font-family="monospace" font-size="10" fill="#302b48">record.</text><path d="M875 129 V476" stroke="#aaa1bc" stroke-dasharray="5 5"/><line x1="185" y1="182" x2="415" y2="182" stroke="#6246ba" stroke-width="2" marker-end="url(#arrow)"/><text x="300" y="156" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#302b48">1. convert(raw)</text><line x1="185" y1="278" x2="645" y2="278" stroke="#6246ba" stroke-width="2" marker-end="url(#arrow)"/><text x="415" y="252" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#302b48">2. alert(s), after id check</text><line x1="185" y1="374" x2="875" y2="374" stroke="#6246ba" stroke-width="2" marker-end="url(#arrow)"/><text x="530" y="348" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#302b48">3. push_back({s, hot})</text><text x="20" y="498" font-family="sans-serif" font-size="11" fill="#747184">Time moves downward. Arrows are calls, not ownership. Return arrows omitted.</text></svg>