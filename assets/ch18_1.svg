<svg xmlns="http://www.w3.org/2000/svg" width="795" height="412" viewBox="0 0 795 412"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#6246ba" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fcfcff"/><rect x="63.166666666666686" y="12" width="232" height="116" rx="10" fill="#eee9fb" stroke="#b7a9df"/><text x="179.16666666666669" y="35" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#302b48">Publisher: Feed</text><text x="179.16666666666669" y="61" text-anchor="middle" font-family="monospace" font-size="10" fill="#302b48">Reset reset{notifying_};</text><path d="M179.16666666666669 129 V380" stroke="#aaa1bc" stroke-dasharray="5 5"/><rect x="281.5" y="12" width="232" height="116" rx="10" fill="#eee9fb" stroke="#b7a9df"/><text x="397.5" y="35" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#302b48">Registration</text><text x="397.5" y="61" text-anchor="middle" font-family="monospace" font-size="10" fill="#302b48">if (auto live = weak.lock())</text><text x="397.5" y="75" text-anchor="middle" font-family="monospace" font-size="10" fill="#302b48">{</text><path d="M397.5 129 V380" stroke="#aaa1bc" stroke-dasharray="5 5"/><rect x="499.83333333333337" y="12" width="232" height="116" rx="10" fill="#eee9fb" stroke="#b7a9df"/><text x="615.8333333333334" y="35" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#302b48">Observer: Total</text><text x="615.8333333333334" y="61" text-anchor="middle" font-family="monospace" font-size="10" fill="#302b48">live-&gt;update(value);</text><path d="M615.8333333333334 129 V380" stroke="#aaa1bc" stroke-dasharray="5 5"/><line x1="179.16666666666669" y1="182" x2="397.5" y2="182" stroke="#6246ba" stroke-width="2" marker-end="url(#arrow)"/><text x="288.33333333333337" y="156" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#302b48">1. try to acquire temporary ownership</text><line x1="397.5" y1="278" x2="615.8333333333334" y2="278" stroke="#6246ba" stroke-width="2" marker-end="url(#arrow)"/><text x="506.6666666666667" y="252" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#302b48">2. only if listener is still alive</text><text x="20" y="402" font-family="sans-serif" font-size="11" fill="#747184">Time moves downward. Arrows are calls, not ownership. Return arrows omitted.</text></svg>