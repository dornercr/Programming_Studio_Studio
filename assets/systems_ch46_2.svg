<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="508" viewBox="0 0 1080 508"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#6246ba" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fcfcff"/><rect x="90.66666666666666" y="12" width="272" height="116" rx="10" fill="#eee9fb" stroke="#b7a9df"/><text x="226.66666666666666" y="35" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#302b48">Producer</text><text x="226.66666666666666" y="61" text-anchor="middle" font-family="monospace" font-size="12" fill="#302b48">// Write before publication.</text><text x="226.66666666666666" y="75" text-anchor="middle" font-family="monospace" font-size="12" fill="#302b48">payload = 42;</text><path d="M226.66666666666666 129 V476" stroke="#aaa1bc" stroke-dasharray="5 5"/><rect x="404" y="12" width="272" height="116" rx="10" fill="#eee9fb" stroke="#b7a9df"/><text x="540" y="35" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#302b48">Atomic readiness</text><text x="540" y="61" text-anchor="middle" font-family="monospace" font-size="12" fill="#302b48">// Initially false.</text><text x="540" y="75" text-anchor="middle" font-family="monospace" font-size="12" fill="#302b48">std::atomic&lt;bool&gt; ready{false};</text><path d="M540 129 V476" stroke="#aaa1bc" stroke-dasharray="5 5"/><rect x="717.3333333333334" y="12" width="272" height="116" rx="10" fill="#eee9fb" stroke="#b7a9df"/><text x="853.3333333333334" y="35" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#302b48">Consumer</text><text x="853.3333333333334" y="61" text-anchor="middle" font-family="monospace" font-size="12" fill="#302b48">// Read after acquire succeeds.</text><text x="853.3333333333334" y="75" text-anchor="middle" font-family="monospace" font-size="12" fill="#302b48">observed = payload;</text><path d="M853.3333333333334 129 V476" stroke="#aaa1bc" stroke-dasharray="5 5"/><line x1="226.66666666666666" y1="182" x2="540" y2="182" stroke="#6246ba" stroke-width="2" marker-end="url(#arrow)"/><text x="383.3333333333333" y="156" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#302b48">1. release-store true after writing payload</text><line x1="540" y1="278" x2="853.3333333333334" y2="278" stroke="#6246ba" stroke-width="2" marker-end="url(#arrow)"/><text x="696.6666666666667" y="252" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#302b48">2. acquire-load observes that true</text><line x1="226.66666666666666" y1="374" x2="853.3333333333334" y2="374" stroke="#6246ba" stroke-width="2" marker-end="url(#arrow)"/><text x="540" y="348" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#302b48">3. prior payload write happens-before payload</text><text x="540" y="363" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#302b48">read</text><text x="20" y="498" font-family="sans-serif" font-size="11" fill="#747184">Time moves downward. Arrows show labeled communication or ordering, not ownership.</text></svg>